spring:
  application:
    name: personal-ai-os

  datasource:
    url: jdbc:postgresql://localhost:5432/personal_ai_os
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info